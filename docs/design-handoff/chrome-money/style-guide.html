document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2px;text-wrap:pretty\">The visual system for Opps. Cold near-black panels, one warm metal gradient reserved for money and the primary action, and heavy condensed display type against a quiet grotesque. Everything below is the contract: tokens, components, states, and the rules an implementer follows.<\u002Fdiv>\n    <div style=\"display:flex;gap:26px;flex-wrap:wrap;margin-top:34px;font-size:12px;letter-spacing:1.5px;color:#6f6a62\">\n      <a href=\"#foundations\">01 FOUNDATIONS<\u002Fa>\n      <a href=\"#components\">02 COMPONENTS<\u002Fa>\n      <a href=\"#patterns\">03 SCREEN PATTERNS<\u002Fa>\n      <a href=\"#rules\">04 IMPLEMENTATION RULES<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ══════ 01 FOUNDATIONS ══════ -->\n  <div id=\"foundations\" style=\"max-width:1080px;margin:0 auto;padding:72px 40px 0\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #232128;padding-bottom:14px;margin-bottom:34px\">\n      <span style=\"font-family:'Anton',sans-serif;font-size:13px;letter-spacing:2px;color:#a8873f\">01<\u002Fspan>\n      <span style=\"font-family:'Anton',sans-serif;font-size:30px;letter-spacing:3px;color:#f2f0ec\">FOUNDATIONS<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:16px\">SURFACES<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:40px\">\n      <sc-for list=\"{{ surfaces }}\" as=\"c\" hint-placeholder-count=\"7\">\n        <div style=\"border:1px solid #232128;border-radius:12px;overflow:hidden\">\n          <div style=\"height:76px;background:{{ c.hex }};border-bottom:1px solid #232128\"><\u002Fdiv>\n          <div style=\"padding:11px 12px\">\n            <div style=\"font-size:12px;color:#f2f0ec;font-weight:500\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',monospace;font-size:11px;color:#6f6a62;margin-top:3px\">{{ c.hex }}<\u002Fdiv>\n            <div style=\"font-size:10px;color:#55555f;margin-top:5px;line-height:1.4\">{{ c.use }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:16px\">INK &amp; SIGNAL<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:40px\">\n      <sc-for list=\"{{ inks }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <div style=\"border:1px solid #232128;border-radius:12px;overflow:hidden\">\n          <div style=\"height:76px;background:{{ c.hex }};border-bottom:1px solid #232128\"><\u002Fdiv>\n          <div style=\"padding:11px 12px\">\n            <div style=\"font-size:12px;color:#f2f0ec;font-weight:500\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',monospace;font-size:11px;color:#6f6a62;margin-top:3px\">{{ c.hex }}<\u002Fdiv>\n            <div style=\"font-size:10px;color:#55555f;margin-top:5px;line-height:1.4\">{{ c.use }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:16px\">THE CHROME GRADIENT<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:16px\">\n      <div style=\"border:1px solid #232128;border-radius:16px;overflow:hidden\">\n        <div style=\"height:96px;background:linear-gradient(135deg,#f3e0b4,#e8c98a 40%,#c9a55c)\"><\u002Fdiv>\n        <div style=\"padding:14px 16px\">\n          <div style=\"font-size:13px;color:#f2f0ec;font-weight:500\">Chrome fill<\u002Fdiv>\n          <div style=\"font-size:11px;color:#6f6a62;margin-top:5px;line-height:1.5;font-family:'Space Grotesk',monospace\">linear-gradient(135deg, #f3e0b4, #e8c98a 40%, #c9a55c)<\u002Fdiv>\n          <div style=\"font-size:11px;color:#8e8e9a;margin-top:8px;line-height:1.5\">Primary buttons and active chips. Ink on it is always #161208, never white.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #232128;border-radius:16px;overflow:hidden\">\n        <div style=\"height:96px;background:#0e0e12;display:flex;align-items:center;justify-content:center\">\n          <span style=\"font-family:'Anton',sans-serif;font-size:44px;letter-spacing:2px;background:linear-gradient(135deg,#f3e0b4,#e8c98a 45%,#a8873f);-webkit-background-clip:text;background-clip:text;color:transparent\">$2,840<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 16px\">\n          <div style=\"font-size:13px;color:#f2f0ec;font-weight:500\">Chrome text<\u002Fdiv>\n          <div style=\"font-size:11px;color:#6f6a62;margin-top:5px;line-height:1.5;font-family:'Space Grotesk',monospace\">…#a8873f, clipped to text<\u002Fdiv>\n          <div style=\"font-size:11px;color:#8e8e9a;margin-top:8px;line-height:1.5\">Reserved: the OPPS wordmark, the bread figure, crew soldier count, gem pack amounts. Nothing else.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-left:2px solid #a8873f;padding:2px 0 2px 16px;font-size:13px;line-height:1.6;color:#8e8e9a;margin-bottom:44px;max-width:660px\">One chrome element per view hierarchy level. If two primary buttons are on screen at once, one of them is wrong.<\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:16px\">TYPE<\u002Fdiv>\n    <div style=\"border:1px solid #232128;border-radius:16px;padding:26px 28px;margin-bottom:16px\">\n      <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"7\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;align-items:baseline;padding:15px 0;border-bottom:1px solid #1d1c22\">\n          <div style=\"font-family:{{ t.stack }};font-size:{{ t.px }};letter-spacing:{{ t.ls }};font-weight:{{ t.weight }};color:{{ t.color }};line-height:1.15;min-width:0\">{{ t.sample }}<\u002Fdiv>\n          <div style=\"font-size:11px;color:#6f6a62;line-height:1.6\">\n            <div style=\"color:#8e8e9a\">{{ t.name }}<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',monospace\">{{ t.spec }}<\u002Fdiv>\n            <div>{{ t.use }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"border-left:2px solid #a8873f;padding:2px 0 2px 16px;font-size:13px;line-height:1.6;color:#8e8e9a;margin-bottom:44px;max-width:660px\">Anton is display only — never body copy, never below 12px, never a full sentence. Space Grotesk carries everything a player reads rather than scans. No third family; Space Grotesk at 500 weight covers the numeric role the old build gave Space Mono.<\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:16px\">GEOMETRY &amp; TEXTURE<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:14px\">\n      <sc-for list=\"{{ geometry }}\" as=\"g\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid #232128;border-radius:16px;padding:20px\">\n          <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:1.5px;color:#f2f0ec\">{{ g.name }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#8e8e9a;margin-top:9px;line-height:1.6\">{{ g.body }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #232128;border-radius:16px;padding:20px;margin-bottom:12px;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.012),rgba(255,255,255,0.012) 1px,transparent 1px,transparent 2px)\">\n      <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:1.5px;color:#f2f0ec\">SCREEN TEXTURE<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8e8e9a;margin-top:9px;line-height:1.6;font-family:'Space Grotesk',monospace\">repeating-linear-gradient(45deg, rgba(255,255,255,.012), rgba(255,255,255,.012) 1px, transparent 1px, transparent 2px)<\u002Fdiv>\n      <div style=\"font-size:12px;color:#8e8e9a;margin-top:8px;line-height:1.6\">A 45° hairline weave on the app background only — this panel has it. Replaces the old horizontal scanline. Never on cards, never on overlays.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ══════ 02 COMPONENTS ══════ -->\n  <div id=\"components\" style=\"max-width:1080px;margin:0 auto;padding:72px 40px 0\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #232128;padding-bottom:14px;margin-bottom:34px\">\n      <span style=\"font-family:'Anton',sans-serif;font-size:13px;letter-spacing:2px;color:#a8873f\">02<\u002Fspan>\n      <span style=\"font-family:'Anton',sans-serif;font-size:30px;letter-spacing:3px;color:#f2f0ec\">COMPONENTS<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:16px\">ACTIONS<\u002Fdiv>\n    <div style=\"border:1px solid #232128;border-radius:16px;padding:26px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:34px\">\n      <div>\n        <div style=\"background:linear-gradient(135deg,#f3e0b4,#e8c98a 40%,#c9a55c);color:#161208;font-family:'Anton',sans-serif;font-size:13px;letter-spacing:1px;padding:9px 18px;border-radius:999px;display:inline-block\">DO IT<\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:10px;line-height:1.6;max-width:180px\">Primary · chrome fill, ink #161208. One per card, one per screen region.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"background:#1b1b22;border:1px solid #33333d;color:#f2f0ec;font-family:'Anton',sans-serif;font-size:13px;letter-spacing:1px;padding:9px 18px;border-radius:999px;display:inline-block\">REST<\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:10px;line-height:1.6;max-width:180px\">Secondary · panel fill, #33333d hairline.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"background:#1b1b22;border:1px solid #5a2b24;color:#e0523f;font-family:'Anton',sans-serif;font-size:13px;letter-spacing:1px;padding:9px 18px;border-radius:999px;display:inline-block\">SLIDE ON 'EM<\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:10px;line-height:1.6;max-width:180px\">Hostile · the only red action. Combat entry exclusively.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"background:#141419;border:1px solid #22222a;color:#4f4f59;font-family:'Anton',sans-serif;font-size:13px;letter-spacing:1px;padding:9px 18px;border-radius:999px;display:inline-block\">MASTERED ✓<\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:10px;line-height:1.6;max-width:180px\">Disabled · never lower the card's opacity, restyle the button.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"background:#141419;border:1px solid #22222a;color:#4f4f59;font-family:'Anton',sans-serif;font-size:13px;letter-spacing:1px;padding:9px 18px;border-radius:999px;display:inline-block\">RANK 5<\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:10px;line-height:1.6;max-width:180px\">Locked · states the gate, not the refusal.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-left:2px solid #a8873f;padding:2px 0 2px 16px;font-size:13px;line-height:1.6;color:#8e8e9a;margin-bottom:44px;max-width:660px\">Every action is a full pill (radius 999px) with Anton at 12–13px and 1px tracking. Height 34–38px on phone; the hit target extends to 44px with padding, not a bigger pill.<\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:16px\">CARD &amp; PANEL<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:44px\">\n      <div style=\"border:1px solid #232128;border-radius:16px;padding:22px\">\n        <div style=\"border-radius:16px;border:1px solid #26262e;background:linear-gradient(180deg,#181820,#111116);padding:13px;display:flex;align-items:center;gap:11px\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\">\n              <div style=\"font-family:'Anton',sans-serif;font-size:14px;letter-spacing:1px;color:#f2f0ec\">RUN PACKAGES<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:700;color:#e8c98a\">$50–$90<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;font-size:10px;color:#7a7a86;margin-top:3px\"><span>2 energy<\u002Fspan><span>15 XP<\u002Fspan><span>5 rep<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;margin-top:7px\">\n              <div style=\"flex:1;height:4px;border-radius:999px;background:#1f1f27\"><div style=\"height:100%;width:75%;border-radius:999px;background:linear-gradient(90deg,#e8c98a,#a8873f)\"><\u002Fdiv><\u002Fdiv>\n              <span style=\"font-size:9px;color:#55555f\">6/8<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:linear-gradient(135deg,#f3e0b4,#e8c98a 40%,#c9a55c);color:#161208;font-family:'Anton',sans-serif;font-size:12px;letter-spacing:1px;padding:8px 16px;border-radius:999px;flex-shrink:0\">DO IT<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:14px;line-height:1.7\">List card · radius 14–16, 1px #26262e, fill <span style=\"font-family:'Space Grotesk',monospace\">linear-gradient(180deg,#181820,#111116)<\u002Fspan>, padding 11–14. Title Anton 14–16, meta 10px #7a7a86, action pinned right and vertically centred.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #232128;border-radius:16px;padding:22px\">\n        <div style=\"border-radius:20px;border:1px solid #26262e;background:linear-gradient(180deg,#181820,#111116);padding:16px\">\n          <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px\">\n            <div>\n              <div style=\"font-size:10px;letter-spacing:2px;color:#7a7a86\">BREAD<\u002Fdiv>\n              <div style=\"font-family:'Anton',sans-serif;font-size:34px;line-height:1;background:linear-gradient(135deg,#f3e0b4,#e8c98a 45%,#c9a55c);-webkit-background-clip:text;background-clip:text;color:transparent\">$2,840<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:right\">\n              <div style=\"font-size:10px;letter-spacing:2px;color:#7a7a86\">REP<\u002Fdiv>\n              <div style=\"font-family:'Anton',sans-serif;font-size:22px;color:#f2f0ec;line-height:1.2\">145<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <div>\n              <div style=\"display:flex;justify-content:space-between;font-size:10px;color:#7a7a86;margin-bottom:6px\"><span>XP<\u002Fspan><span>96 / 256<\u002Fspan><\u002Fdiv>\n              <div style=\"height:7px;border-radius:999px;background:#1f1f27\"><div style=\"height:100%;width:37%;border-radius:999px;background:#6f8cff\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex;justify-content:space-between;font-size:10px;color:#7a7a86;margin-bottom:6px\"><span>ENERGY<\u002Fspan><span>7 / 14<\u002Fspan><\u002Fdiv>\n              <div style=\"height:7px;border-radius:999px;background:#1f1f27\"><div style=\"height:100%;width:50%;border-radius:999px;background:linear-gradient(90deg,#e8c98a,#a8873f)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex;justify-content:space-between;font-size:10px;color:#7a7a86;margin-bottom:6px\"><span>HEALTH<\u002Fspan><span>92 / 130<\u002Fspan><\u002Fdiv>\n              <div style=\"height:7px;border-radius:999px;background:#1f1f27\"><div style=\"height:100%;width:71%;border-radius:999px;background:#4fd39a\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:14px;line-height:1.7\">HUD panel · radius 20, padding 16. Bread is the only chrome-text figure. Bars are 7px, track #1f1f27, fully rounded. Label left, value right, both 10px.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:16px\">BARS, CHIPS &amp; PORTRAITS<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:44px\">\n      <div style=\"border:1px solid #232128;border-radius:16px;padding:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:13px\">\n          <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"5\">\n            <div>\n              <div style=\"display:flex;justify-content:space-between;font-size:10px;color:#7a7a86;margin-bottom:6px\"><span>{{ b.name }}<\u002Fspan><span>{{ b.spec }}<\u002Fspan><\u002Fdiv>\n              <div style=\"height:7px;border-radius:999px;background:#1f1f27\"><div style=\"height:100%;width:{{ b.pct }};border-radius:999px;background:{{ b.fill }}\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:16px;line-height:1.7\">Each meter owns one colour permanently. XP is the only blue in the app; health the only green outside income figures.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #232128;border-radius:16px;padding:22px\">\n        <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px\">\n          <div style=\"font-size:10px;font-weight:700;letter-spacing:0.5px;color:#161208;background:linear-gradient(135deg,#f3e0b4,#e8c98a 40%,#c9a55c);border-radius:999px;padding:7px 9px\">PLUGS<\u002Fdiv>\n          <div style=\"font-size:10px;letter-spacing:0.5px;color:#8e8e9a;border:1px solid #26262e;border-radius:999px;padding:7px 9px\">GEAR<\u002Fdiv>\n          <div style=\"font-size:10px;letter-spacing:0.5px;color:#8e8e9a;border:1px solid #26262e;border-radius:999px;padding:7px 9px\">SPOTS<\u002Fdiv>\n          <div style=\"font-size:10px;letter-spacing:0.5px;color:#8e8e9a;border:1px solid #26262e;border-radius:999px;padding:7px 9px\">STATS<\u002Fdiv>\n          <div style=\"font-size:10px;letter-spacing:0.5px;color:#8e8e9a;border:1px solid #26262e;border-radius:999px;padding:7px 9px\">CREW<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <div style=\"width:62px;height:62px;border-radius:999px;padding:2px;background:linear-gradient(135deg,#e8c98a,#a8873f);flex-shrink:0\"><img src=\"33a17c4d-1a81-48c2-868e-b8ab59d3af01\" alt=\"Plug portrait\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:999px;display:block\"><\u002Fdiv>\n          <div style=\"width:58px;height:58px;border-radius:999px;border:1px solid #33333d;overflow:hidden;background:#101014;flex-shrink:0\"><img src=\"c17a882a-2df5-486a-b5ba-ebbed18a32d6\" alt=\"Enemy portrait\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center\"><\u002Fdiv>\n          <div style=\"font-size:11px;color:#6f6a62;line-height:1.7\">Allies get a 2px chrome ring. Opps get a flat #33333d hairline. Both circular, <span style=\"font-family:'Space Grotesk',monospace\">object-position: top center<\u002Fspan>.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:16px;line-height:1.7\">Sub-nav chips: 10px, 7px/9px padding, active = chrome fill + ink. Five chips fit 350px; do not add a sixth.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:16px\">THREAT &amp; FEED<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:12px\">\n      <div style=\"border:1px solid #232128;border-radius:16px;padding:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ threats }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span style=\"font-size:11px;letter-spacing:1px;color:#e0523f\">{{ t.bar }}<\u002Fspan>\n              <span style=\"font-size:9px;letter-spacing:1.5px;color:#55555f\">{{ t.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:16px;line-height:1.7\">Threat stays a block meter out of 8, always #e0523f on #55555f. It is a rating, not a progress bar — never animate it.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #232128;border-radius:16px;padding:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font-size:11px;color:#8e8e9a;display:flex;gap:8px;align-items:center\"><span style=\"width:4px;height:4px;border-radius:999px;background:#4fd39a;flex-shrink:0\"><\u002Fspan><span>Collected $220 from your spots<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:11px;color:#55555f;display:flex;gap:8px;align-items:center\"><span style=\"width:4px;height:4px;border-radius:999px;background:#2f2f39;flex-shrink:0\"><\u002Fspan><span>Run Packages → earned $74 + 15 XP<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:11px;color:#55555f;display:flex;gap:8px;align-items:center\"><span style=\"width:4px;height:4px;border-radius:999px;background:#5a2b24;flex-shrink:0\"><\u002Fspan><span>Car Jackers ran you down · −18 HP<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#6f6a62;margin-top:16px;line-height:1.7\">The feed is two lines, no panel, no border. Newest line at full #8e8e9a with a live dot; older lines drop to #55555f. The dot carries the outcome colour, the text never does.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ══════ 03 PATTERNS ══════ -->\n  <div id=\"patterns\" style=\"max-width:1080px;margin:0 auto;padding:72px 40px 0\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #232128;padding-bottom:14px;margin-bottom:34px\">\n      <span style=\"font-family:'Anton',sans-serif;font-size:13px;letter-spacing:2px;color:#a8873f\">03<\u002Fspan>\n      <span style=\"font-family:'Anton',sans-serif;font-size:30px;letter-spacing:3px;color:#f2f0ec\">SCREEN PATTERNS<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px\">\n      <sc-for list=\"{{ patterns }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <div style=\"border:1px solid #232128;border-radius:16px;padding:22px\">\n          <div style=\"font-family:'Anton',sans-serif;font-size:16px;letter-spacing:1.5px;color:#f2f0ec\">{{ p.name }}<\u002Fdiv>\n          <div style=\"font-size:12px;line-height:1.7;color:#8e8e9a;margin-top:10px;text-wrap:pretty\">{{ p.body }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"border-left:2px solid #a8873f;padding:2px 0 2px 16px;font-size:13px;line-height:1.6;color:#8e8e9a;max-width:660px\">Every tab uses the same skeleton: status strip, 19px Anton title with an optional right-aligned 11px stat, optional chip row, scrolling content at 20px side padding, five-item tab bar. Only Hood and Map deviate — Hood adds the HUD panel, Map goes edge to edge.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ══════ 04 RULES ══════ -->\n  <div id=\"rules\" style=\"max-width:1080px;margin:0 auto;padding:72px 40px 0\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #232128;padding-bottom:14px;margin-bottom:20px\">\n      <span style=\"font-family:'Anton',sans-serif;font-size:13px;letter-spacing:2px;color:#a8873f\">04<\u002Fspan>\n      <span style=\"font-family:'Anton',sans-serif;font-size:30px;letter-spacing:3px;color:#f2f0ec\">IMPLEMENTATION RULES<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:14px;line-height:1.7;color:#8e8e9a;max-width:660px;margin-bottom:30px\">Written for whoever ports <span style=\"font-family:'Space Grotesk',monospace;color:#e8c98a\">css/styles.css<\u002Fspan> to this system. The same content is in <span style=\"font-family:'Space Grotesk',monospace;color:#e8c98a\">CLAUDE.md<\u002Fspan> at the project root, ready to drop into the repo.<\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:14px\">TOKEN MIGRATION<\u002Fdiv>\n    <div style=\"border:1px solid #232128;border-radius:16px;overflow:hidden;margin-bottom:40px\">\n      <div style=\"display:grid;grid-template-columns:150px 130px minmax(0,1fr);gap:14px;padding:13px 18px;background:#101014;font-size:10px;letter-spacing:2px;color:#55555f;border-bottom:1px solid #232128\">\n        <span>VARIABLE<\u002Fspan><span>WAS → IS<\u002Fspan><span>RULE<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ tokenMap }}\" as=\"t\" hint-placeholder-count=\"9\">\n        <div style=\"display:grid;grid-template-columns:150px 130px minmax(0,1fr);gap:14px;padding:13px 18px;border-bottom:1px solid #1d1c22;align-items:center\">\n          <span style=\"font-family:'Space Grotesk',monospace;font-size:11px;color:#e8c98a\">{{ t.v }}<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px;font-size:10px;color:#6f6a62\">\n            <span style=\"width:13px;height:13px;border-radius:3px;background:{{ t.from }};flex-shrink:0\"><\u002Fspan>\n            <span style=\"width:13px;height:13px;border-radius:3px;background:{{ t.to }};flex-shrink:0\"><\u002Fspan>\n            <span style=\"font-family:'Space Grotesk',monospace\">{{ t.to }}<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size:11px;color:#8e8e9a;line-height:1.6;min-width:0\">{{ t.rule }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:14px\">CLASS-BY-CLASS<\u002Fdiv>\n    <div style=\"border:1px solid #232128;border-radius:16px;overflow:hidden;margin-bottom:40px\">\n      <div style=\"display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;padding:13px 18px;background:#101014;font-size:10px;letter-spacing:2px;color:#55555f;border-bottom:1px solid #232128\">\n        <span>SELECTOR<\u002Fspan><span>CHANGE<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ classMap }}\" as=\"c\" hint-placeholder-count=\"14\">\n        <div style=\"display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;padding:12px 18px;border-bottom:1px solid #1d1c22\">\n          <span style=\"font-family:'Space Grotesk',monospace;font-size:11px;color:#e8c98a;word-break:break-word\">{{ c.sel }}<\u002Fspan>\n          <span style=\"font-size:11px;color:#8e8e9a;line-height:1.65;min-width:0\">{{ c.change }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:14px\">STRUCTURAL CHANGES<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:40px\">\n      <sc-for list=\"{{ structural }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <div style=\"border:1px solid #232128;border-radius:14px;padding:18px 20px\">\n          <div style=\"font-family:'Anton',sans-serif;font-size:14px;letter-spacing:1.5px;color:#f2f0ec\">{{ s.name }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#8e8e9a;line-height:1.7;margin-top:8px;text-wrap:pretty\">{{ s.body }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:40px\">\n      <div style=\"border:1px solid #24382c;border-radius:16px;padding:22px;background:#0d1210\">\n        <div style=\"font-family:'Anton',sans-serif;font-size:14px;letter-spacing:2px;color:#4fd39a;margin-bottom:14px\">ALWAYS<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ dos }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <div style=\"font-size:12px;color:#9db3a6;line-height:1.6\">{{ d }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #3a221e;border-radius:16px;padding:22px;background:#120d0c\">\n        <div style=\"font-family:'Anton',sans-serif;font-size:14px;letter-spacing:2px;color:#e0523f;margin-bottom:14px\">NEVER<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ donts }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <div style=\"font-size:12px;color:#b39590;line-height:1.6\">{{ d }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;color:#8e8e9a;margin-bottom:14px\">DROP-IN :ROOT<\u002Fdiv>\n    <div style=\"border:1px solid #232128;border-radius:16px;background:#0d0d11;padding:24px 26px;font-family:'Space Grotesk',monospace;font-size:12px;line-height:1.9;color:#8e8e9a;white-space:pre;overflow-x:auto\">{{ rootCss }}<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1160,&quot;height&quot;:1400}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      surfaces: [\n        { name:'App background', hex:'#08080a', use:'Page behind the frame' },\n        { name:'Screen', hex:'#0b0b0c', use:'Inside the phone, carries the weave' },\n        { name:'Well', hex:'#0d0d11', use:'Code blocks, combat log, inset areas' },\n        { name:'Panel top', hex:'#181820', use:'Card gradient start' },\n        { name:'Panel base', hex:'#111116', use:'Card gradient end' },\n        { name:'Control', hex:'#1b1b22', use:'Secondary buttons, active tab' },\n        { name:'Track', hex:'#1f1f27', use:'Meter tracks, dividers' }\n      ],\n      inks: [\n        { name:'Ink', hex:'#f2f0ec', use:'Titles, primary values' },\n        { name:'Body', hex:'#d8d6d0', use:'Dialogue, running copy' },\n        { name:'Muted', hex:'#8e8e9a', use:'Descriptions, inactive tabs' },\n        { name:'Faint', hex:'#7a7a86', use:'Meta rows, bar labels' },\n        { name:'Ghost', hex:'#55555f', use:'Status strip, captions' },\n        { name:'Disabled', hex:'#4f4f59', use:'Locked and mastered text' },\n        { name:'Chrome', hex:'#e8c98a', use:'Money, active chip ink source' },\n        { name:'Hostile', hex:'#e0523f', use:'Threat, enemy HP, combat only' },\n        { name:'Income', hex:'#4fd39a', use:'Health, gains, drop pins' },\n        { name:'XP', hex:'#6f8cff', use:'XP meter only' },\n        { name:'Hairline', hex:'#26262e', use:'Every card border' },\n        { name:'Chrome edge', hex:'#3d3627', use:'Active tab and overlay border' }\n      ],\n      typeScale: [\n        { name:'Wordmark', stack:\"'Anton',sans-serif\", px:'27px', ls:'4px', weight:'400', color:'#e8c98a', spec:'Anton 27 / +4', use:'OPPS lockup, chrome-clipped', sample:'OPPS' },\n        { name:'Money figure', stack:\"'Anton',sans-serif\", px:'36px', ls:'0.5px', weight:'400', color:'#e8c98a', spec:'Anton 36 / +0.5', use:'Bread, crew counters', sample:'$2,840' },\n        { name:'Screen title', stack:\"'Anton',sans-serif\", px:'19px', ls:'2px', weight:'400', color:'#f2f0ec', spec:'Anton 19 / +2', use:'Every tab header', sample:'OPPS LIST' },\n        { name:'Card title', stack:\"'Anton',sans-serif\", px:'15px', ls:'1px', weight:'400', color:'#f2f0ec', spec:'Anton 15 / +1', use:'Job, enemy, plug, item names', sample:'Boost a Whip' },\n        { name:'Action', stack:\"'Anton',sans-serif\", px:'13px', ls:'1px', weight:'400', color:'#f2f0ec', spec:'Anton 13 / +1', use:'All button labels', sample:'COLLECT' },\n        { name:'Body', stack:\"'Space Grotesk',sans-serif\", px:'15px', ls:'0', weight:'400', color:'#d8d6d0', spec:'Grotesk 15 / 1.5', use:'Plug dialogue, explanations', sample:'My re-up just landed and it’s heavy.' },\n        { name:'Meta', stack:\"'Space Grotesk',sans-serif\", px:'11px', ls:'0', weight:'400', color:'#7a7a86', spec:'Grotesk 11', use:'Costs, rewards, counts', sample:'2 energy · 15 XP · 5 rep' },\n        { name:'Label', stack:\"'Space Grotesk',sans-serif\", px:'10px', ls:'2px', weight:'500', color:'#7a7a86', spec:'Grotesk 10 / +2 caps', use:'Bar labels, stat keys', sample:'ENERGY' }\n      ],\n      geometry: [\n        { name:'RADIUS', body:'Phone frame 26. HUD and overlays 20–24. Cards 14–16. Every pill and meter 999. Nothing square, nothing at 2–4px like the old build.' },\n        { name:'SPACING', body:'20px side padding on every screen. 9px between list cards, 7px in dense lists, 14px between sections. Grids use gap, never margins.' },\n        { name:'BORDERS', body:'1px always. #26262e on cards, #33333d on controls and portraits, #3d3627 when chrome-active, #5a2b24 on hostile. No 2px rules except the overlay edge.' },\n        { name:'ELEVATION', body:'One shadow in the system: 0 30px 80px rgba(0,0,0,0.6) on modals. Cards lift with the 180° gradient, not a shadow.' }\n      ],\n      bars: [\n        { name:'XP', spec:'#6f8cff', pct:'37%', fill:'#6f8cff' },\n        { name:'ENERGY', spec:'#e8c98a → #a8873f', pct:'50%', fill:'linear-gradient(90deg,#e8c98a,#a8873f)' },\n        { name:'HEALTH', spec:'#4fd39a', pct:'71%', fill:'#4fd39a' },\n        { name:'ENEMY HP', spec:'#e0523f', pct:'100%', fill:'#e0523f' },\n        { name:'MASTERY', spec:'#e8c98a → #a8873f, 4px', pct:'75%', fill:'linear-gradient(90deg,#e8c98a,#a8873f)' }\n      ],\n      threats: [\n        { bar:'██░░░░░░', label:'THREAT 2 · LOCAL SNITCH' },\n        { bar:'██████░░', label:'THREAT 6 · CAR JACKERS' },\n        { bar:'████████', label:'THREAT 8 · UNDERCOVER FED' }\n      ],\n      patterns: [\n        { name:'THE HOOD', body:'Wordmark and rank pill, then the HUD panel, then two feed lines, then the activity list. The HUD is the only place bread appears at display size. Collect is the single chrome action; Rest and Launder are secondary.' },\n        { name:'MAP', body:'Edge to edge between the header and tab bar, no side padding. Controls stack top-right as 36px rounded squares; the legend sits bottom-left in a translucent panel. Pin colours are fixed: chrome for your turf, #e0523f for opps, #4fd39a for drops.' },\n        { name:'LISTS (MOVES, OPPS, SPOTS)', body:'One row per record, action pinned right, no grid. Locked rows keep full contrast and swap the action for a rank chip — never dim the row to 40%.' },\n        { name:'GRIDS (GEAR, GEMS)', body:'Two columns, minmax(0,1fr), 9px gap. Cards are centred with the action full-width at the bottom. Badges overhang the top edge by 9px.' },\n        { name:'EMPIRE SUB-NAV', body:'Five chips above the content: Plugs, Gear, Spots, Stats, Crew. Active chip is chrome-filled. The chip row scrolls with the content, not the header.' },\n        { name:'OVERLAYS', body:'Combat centres in the viewport; the plug dialog rises from the bottom edge. Both blur the screen behind at 3px and 0.3 opacity over rgba(6,6,8,0.72). Overlay border is #3d3627.' }\n      ],\n      tokenMap: [\n        { v:'--bg', from:'#0a0a0a', to:'#0b0b0c', rule:'Screen surface. The app shell behind the frame goes #08080a.' },\n        { v:'--panel', from:'#111111', to:'#111116', rule:'Now the base of a 180° gradient from #181820, not a flat fill.' },\n        { v:'--border', from:'#222222', to:'#26262e', rule:'Single hairline weight everywhere. #33333d for interactive edges.' },\n        { v:'--accent', from:'#ff3a00', to:'#e8c98a', rule:'The orange accent is retired. Chrome replaces it in every non-combat role.' },\n        { v:'--gold', from:'#f5c400', to:'#e8c98a', rule:'Folds into chrome. No separate gold.' },\n        { v:'--green', from:'#00e676', to:'#4fd39a', rule:'Desaturated. Income and health only.' },\n        { v:'--red', from:'#ff1744', to:'#e0523f', rule:'Combat and threat only. Never a border accent or a toast.' },\n        { v:'--text', from:'#e8e8e8', to:'#f2f0ec', rule:'Warmer ink. Body copy steps down to #d8d6d0.' },\n        { v:'--muted', from:'#666666', to:'#8e8e9a', rule:'Lifted for contrast; #7a7a86 and #55555f handle the lower tiers.' }\n      ],\n      classMap: [\n        { sel:'.logo', change:'Anton 27, +4 tracking, chrome-clipped text. Drop the orange glow text-shadow and the gold span.' },\n        { sel:'.hud-stat', change:'Replaced by the HUD panel. Rank and gems become pills in the header row; money, rep, XP, energy and health live in the panel.' },\n        { sel:'nav / .nav-item', change:'Drawer and nine items removed. Five-item tab bar at the bottom; Plugs, Gear, Spots, Stats and Crew become chips inside Empire. Active tab = #1b1b22 pill with a #3d3627 border and #e8c98a label — no left border accent.' },\n        { sel:'.card / .card-title', change:'radius 4 → 16, flat panel → 180° gradient, border #26262e. Title loses its bottom rule and accent colour; it becomes Anton 15 in #f2f0ec.' },\n        { sel:'.job-card', change:'Grid → single-column rows, 11px/13px padding, radius 14. Remove the ::before accent stripe. Locked cards keep opacity 1 and show a RANK n chip.' },\n        { sel:'.do-job-btn', change:'Full-width orange → right-aligned chrome pill, Anton 12, ink #161208. Disabled = #141419 fill, #22222a border, #4f4f59 label.' },\n        { sel:'.attack-btn', change:'Solid red → #1b1b22 with a #5a2b24 border and #e0523f label. Two-line “SLIDE ON ’EM”.' },\n        { sel:'.enemy-avatar / .enemy-portrait', change:'48px square → 58px circle, 1px #33333d, object-position top center. Drop the saturate(0.7) filter.' },\n        { sel:'.plug-card', change:'110px side image → 62px circular portrait with a 2px chrome ring. Name Anton 15, moniker 9px +2 chrome, line 11px #7a7a86 roman — remove the italic.' },\n        { sel:'.bar-track / .bar-fill', change:'6px, radius 2 → 7px, radius 999, track #1f1f27. Fixed fills per meter; keep the 0.4s width transition.' },\n        { sel:'.store-item / .prop-card', change:'Emoji icon removed entirely. Two-column grid, name Anton 15, effect #4fd39a, price #e8c98a 13px, action full-width pill.' },\n        { sel:'.gem-card', change:'Purple #b388ff retired — amounts render in chrome text. Badge overhangs the top edge as a chrome pill, 8px caps.' },\n        { sel:'.combat-box', change:'360px box, 2px orange border → 24px radius, 1px #3d3627, padding 20, shadow 0 30px 80px rgba(0,0,0,.6). Title chrome-clipped Anton 22.' },\n        { sel:'.combat-log', change:'Monospace log → an 74px sparkline well on #0d0d11: chrome line for you, #e0523f for the opp.' },\n        { sel:'.levelup-banner / .toast', change:'Both keep their geometry but switch to the panel gradient with a #3d3627 border and chrome text. No orange glow, no green left border.' },\n        { sel:'.map-controls button', change:'34px radius-3 → 36px radius-12 on rgba(17,17,22,0.9), border #33333d. Active mode gets a #3d3627 border and #e8c98a label instead of a gold fill.' },\n        { sel:'.map-outer', change:'Base #494741 → #17171c. Blocks #0b0b0c, buildings #1f1f28, lane markings #a8873f, water #0e2430, parks #141a17.' },\n        { sel:'::-webkit-scrollbar', change:'Track #0b0b0c, thumb #2a2a34. Width stays 4px.' }\n      ],\n      structural: [\n        { name:'NAVIGATION', body:'Nine sidebar items collapse to five bottom tabs — Hood, Map, Moves, Opps, Empire. Empire holds Plugs, Gear, Spots, Stats and Crew behind a chip row. The drawer, the backdrop and the hamburger all come out.' },\n        { name:'NO EMOJI', body:'Every emoji icon is removed: nav icons, item icons, property icons, fighter icons, enemy avatars. Meaning is carried by colour, type weight and the real portrait art.' },\n        { name:'LOCKED STATES', body:'The old pattern dimmed whole cards to 40% opacity, which fails contrast. Locked content now renders at full strength with the action replaced by a disabled chip naming the gate.' },\n        { name:'MONEY IS SACRED', body:'Cash figures use chrome and nothing else uses chrome text. Prices in lists stay #e8c98a at 11–13px; only the HUD bread renders at display size.' },\n        { name:'ONE TEXTURE', body:'The body scanline is replaced by a 45° weave at 1.2% white, applied to the screen surface only. Cards, overlays and the map stay clean.' }\n      ],\n      dos: [\n        'Keep chrome for money and the single primary action.',\n        'Use 999px radius for anything pressable.',\n        'Give every tap target 44px of height including padding.',\n        'Anchor list actions right, vertically centred.',\n        'State the gate on locked items (\"RANK 5\"), not the refusal.',\n        'Use gap for sibling spacing, never per-child margins.',\n        'Keep 20px side padding on every screen but the map.'\n      ],\n      donts: [\n        'No orange #ff3a00 anywhere — it is fully retired.',\n        'No emoji, including in the feed and toasts.',\n        'No opacity below 1 on content; restyle instead of dimming.',\n        'No Anton under 12px and no Anton sentences.',\n        'No second shadow value beyond the modal one.',\n        'No red outside combat, threat and enemy HP.',\n        'No square corners and no 2–4px radii.'\n      ],\n      rootCss: `:root {\n  /* surfaces */\n  --app:        #08080a;\n  --bg:         #0b0b0c;\n  --well:       #0d0d11;\n  --panel-top:  #181820;\n  --panel:      #111116;\n  --control:    #1b1b22;\n  --track:      #1f1f27;\n\n  /* borders */\n  --border:      #26262e;\n  --border-ctrl: #33333d;\n  --border-gold: #3d3627;\n  --border-red:  #5a2b24;\n\n  /* ink */\n  --text:      #f2f0ec;\n  --body:      #d8d6d0;\n  --muted:     #8e8e9a;\n  --faint:     #7a7a86;\n  --ghost:     #55555f;\n  --disabled:  #4f4f59;\n\n  /* signal */\n  --chrome:     #e8c98a;\n  --chrome-ink: #161208;\n  --red:        #e0523f;\n  --green:      #4fd39a;\n  --xp:         #6f8cff;\n\n  --chrome-fill: linear-gradient(135deg,#f3e0b4,#e8c98a 40%,#c9a55c);\n  --panel-fill:  linear-gradient(180deg,#181820,#111116);\n  --energy-fill: linear-gradient(90deg,#e8c98a,#a8873f);\n  --modal-shadow: 0 30px 80px rgba(0,0,0,.6);\n\n  --r-card: 16px;  --r-panel: 20px;  --r-pill: 999px;\n  --pad-screen: 20px;  --gap-list: 9px;  --gap-section: 14px;\n\n  --display: 'Anton', sans-serif;\n  --ui:      'Space Grotesk', sans-serif;\n}`\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
